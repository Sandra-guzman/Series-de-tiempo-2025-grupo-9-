name: Build and Deploy Jupyter Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -U jupyter-book ghp-import

      - name: Debug structure
        run: |
          echo "📁 Estructura completa del proyecto:"
          find . -maxdepth 3 -type f

      - name: Build the Jupyter Book
        working-directory: ./book
        run: |
          echo "🚧 Iniciando construcción del libro..."
          jupyter-book build . -v || (echo "❌ Falló el build del libro" && exit 1)

      - name: Check build output
        run: |
          echo "📁 Comprobando salida del build..."
          if [ -d "book/_build/html" ]; then
            echo "✅ Carpeta de salida encontrada: book/_build/html"
            ls -la book/_build/html
          else
            echo "❌ No se encontró la carpeta book/_build/html"
            echo "⚠️ Revisa los logs del paso anterior (Build the Jupyter Book)"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Desplegando en GitHub Pages..."
          ghp-import -n -p -f book/_build/html
