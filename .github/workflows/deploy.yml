name: Build and Deploy Jupyter Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter-book==0.15.1 ghp-import

      - name: List files before build
        run: |
          echo "📁 Estructura del proyecto antes del build:"
          ls -R

      

      - name: Debug Python environment
        run: |
          which python
          python --version
          which jupyter-book
          jupyter-book --version
          echo "Intentando import jupyter_book en Python:"
          python -c "import jupyter_book; print('✅ jupyter_book importado correctamente')"


      - name: Build the Jupyter Book (Safe Mode)
        working-directory: ./book
        run: |
          echo "🚧 Iniciando construcción del libro..."
          echo "📂 Carpeta actual (pwd):"
          pwd
          echo "📁 Contenido visible:"
          ls -la
          echo "🔍 Verificando existencia de _config.yml y _toc.yml..."
          test -f "_config.yml" && echo "✅ _config.yml encontrado" || echo "❌ _config.yml NO encontrado"
          test -f "_toc.yml" && echo "✅ _toc.yml encontrado" || echo "❌ _toc.yml NO encontrado"
          echo "🏗 Ejecutando build..."
          jupyter-book build . || (echo "❌ Falló el build del libro" && exit 1)
          echo "✅ Si ves este mensaje, el comando jupyter-book build se ejecutó correctamente"


      - name: Inspect build logs
        if: always()
        run: |
          echo "🧾 Buscando logs en book/_build/logs..."
          find ./book/_build -type f -print || echo "⚠️ No se encontraron logs"
          echo "==================== CONTENIDO DEL LOG ===================="
          cat ./book/_build/logs/myst.build.json 2>/dev/null || echo "⚠️ No se pudo leer myst.build.json"
          echo "==========================================================="


      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Desplegando en GitHub Pages..."
          ghp-import -n -p -f ./book/_build/html
