name: Build and Deploy Jupyter Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write


jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -U jupyter-book ghp-import

      - name: List files before build
        run: |
          echo "📁 Estructura del proyecto antes del build:"
          ls -la
          ls -la book || true

      - name: Build the Jupyter Book (debug mode)
        working-directory: ./book
        run: |
          echo "🚧 Iniciando construcción del libro..."
          jupyter-book build . -v

      - name: List build output (debug)
        run: |
          echo "📁 Comprobando salida del build:"
          ls -la book/_build || echo "⚠️ book/_build no existe"
          ls -la book/_build/html || echo "⚠️ book/_build/html no existe"

      - name: Deploy to GitHub Pages (only if build succeeded)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Desplegando en GitHub Pages..."
          if [ -d "book/_build/html" ]; then
            ghp-import -n -p -f book/_build/html
          else
            echo "❌ No se encontró book/_build/html. Abortando despliegue."
            echo "Mira los pasos anteriores para ver por qué el build falló."
            exit 1
          fi
