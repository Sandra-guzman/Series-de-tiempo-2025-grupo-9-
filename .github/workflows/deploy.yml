name: Build and Deploy Jupyter Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -U jupyter-book ghp-import

      - name: List files before build
        run: |
          echo "📁 Estructura del proyecto antes del build:"
          ls -R

      

      - name: Debug Python environment
        run: |
          which python
          python --version
          which jupyter-book
          jupyter-book --version
          echo "Intentando import jupyter_book en Python:"
          python -c "import jupyter_book; print('✅ jupyter_book importado correctamente')"


      - name: Build the Jupyter Book (Safe Mode)
        run: |
          echo "🚧 Iniciando construcción del libro..."
          
          # 1. Navega a la carpeta del libro
          cd book
          
          echo "🧹 Ejecutando clean en el directorio actual (./)..."
          # Limpiamos el directorio actual (que ahora es 'book')
          jupyter-book clean .
          
          # 2. Construcción: Usa el directorio actual (.) como raíz del proyecto
          echo "🏗 Ejecutando build desde dentro de la carpeta 'book'..."
          # Usar . significa: "Construye el libro que se encuentra en este directorio"
          jupyter-book build . --all || (echo "❌ Falló el build del libro" && exit 1) 
          
          # 3. Verificación de salida: Ahora _build está en el directorio actual
          echo "📦 Archivos generados:"
          ls -R ./_build || echo "⚠️ No se generó carpeta _build"

      - name: Inspect build logs
        if: always()
        run: |
          echo "🧾 Buscando logs en book/_build/logs..."
          find ./book/_build -type f -print || echo "⚠️ No se encontraron logs"
          echo "==================== CONTENIDO DEL LOG ===================="
          cat ./book/_build/logs/myst.build.json 2>/dev/null || echo "⚠️ No se pudo leer myst.build.json"
          echo "==========================================================="


      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Desplegando en GitHub Pages..."
          ghp-import -n -p -f mybook/_build/html
